<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Öppnar i Agenda …</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; display: flex; min-height: 100vh;
         align-items: center; justify-content: center; margin: 0; background: #f6f6f4; color: #222; }
  main { text-align: center; padding: 2rem; }
  a { display: inline-block; margin-top: 1rem; padding: .8rem 1.4rem; border-radius: 10px;
      background: #2b6cb0; color: #fff; text-decoration: none; font-weight: 600; }
  p.fel { color: #b00; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #eee; } }
</style>
</head>
<body>
<main>
  <p id="status">Öppnar anteckningen i Agenda …</p>
  <a id="knapp" href="#" hidden>Öppna i Agenda</a>
</main>
<script>
  // Anteckningens id ligger efter # i adressen, t.ex. agenda.html#60B359C2-5D67-4E98-87BC-D1D74CB41412
  // Delen efter # skickas aldrig till servern.
  var id = decodeURIComponent(location.hash.slice(1));
  var giltigt = /^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$/.test(id);
  var status = document.getElementById("status");
  var knapp = document.getElementById("knapp");
  if (giltigt) {
    var mal = "agenda://note/" + id;
    knapp.href = mal;
    knapp.hidden = false;
    status.textContent = "Öppnar anteckningen i Agenda …";
    window.location.href = mal;
  } else {
    status.textContent = "Länken saknar ett giltigt anteckningsid.";
    status.className = "fel";
  }
</script>
</body>
</html>
